name: Build and release

on:
  push:
    branches:
      - master

jobs:
  check_version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether this version was already released
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test_and_build:
    name: Build and publish
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn --ignore-engines
      - name: Run tests
        run: yarn test
      - name: Run Trivy scanner on fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: 1
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
      - name: Run build
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sofa-build-output
          path: dist
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check_version.outputs.version }}"
          git push origin "v${{ needs.check_version.outputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    strategy:
      fail-fast: false
      matrix:
        registry-url: ['https://npm.pkg.github.com', 'https://registry.npmjs.org']
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    needs: [check_version, test_and_build]
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: sofa-build-output
          path: dist
      - name: Set registry token
        id: token
        run: |
          if [[ "${{ matrix.registry-url }}" == "https://npm.pkg.github.com" ]]; then
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ matrix.registry-url }}" == "https://registry.npmjs.org" ]]; then
            echo "token=${{ secrets.NPM_TOKEN }}" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: ${{ matrix.registry-url }}
      - name: Publish package
        working-directory: dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ steps.token.outputs.token }}
