name: Sync upstream

on:
  schedule:
    # Daily at 03:17 UTC
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/graphql-hive/SOFA.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Merge upstream/master into master
        id: merge
        run: |
          # This fork intentionally deletes some upstream paths (website/docs/
          # example, etc). When upstream later modifies one of those, git flags
          # it as a modify/delete conflict. Auto-resolve any such conflict by
          # keeping it deleted (no whitelist needed - this generically applies
          # to whatever we've removed). Any other kind of conflict (e.g. real
          # overlapping edits in src/) is left as-is and reported below.
          git merge --no-commit --no-ff upstream/master || true

          git status --porcelain \
            | awk '$1 == "DU" { print substr($0, 4) }' \
            | while IFS= read -r path; do
                git rm -rf --ignore-unmatch -- "$path" >/dev/null
              done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          else
            # No unresolved conflicts. If upstream had nothing new (or we'd
            # already merged it), there's no MERGE_HEAD and nothing to commit -
            # that's success, not an error.
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit
            fi
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin master

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Upstream sync conflict';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            });
            if (existing.some(issue => issue.title === title)) {
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream-sync'],
              body: 'Merging `upstream/master` (graphql-hive/SOFA) into `master` failed due to conflicts. Please resolve manually:\n\n```sh\ngit remote add upstream https://github.com/graphql-hive/SOFA.git\ngit fetch upstream master\ngit merge upstream/master\n# resolve conflicts\ngit push origin master\n```',
            });
