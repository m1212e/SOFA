name: Sync upstream

on:
  schedule:
    # Daily at 03:17 UTC
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/graphql-hive/SOFA.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Merge upstream/master into master
        id: merge
        run: |
          if git merge --no-edit upstream/master; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged changes
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin master

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Upstream sync conflict';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            });
            if (existing.some(issue => issue.title === title)) {
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream-sync'],
              body: 'Merging `upstream/master` (graphql-hive/SOFA) into `master` failed due to conflicts. Please resolve manually:\n\n```sh\ngit remote add upstream https://github.com/graphql-hive/SOFA.git\ngit fetch upstream master\ngit merge upstream/master\n# resolve conflicts\ngit push origin master\n```',
            });
